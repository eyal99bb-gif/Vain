name: Paper auto-trader (Alpaca)

on:
  schedule:
    - cron: "9,39 * * * *"
  workflow_dispatch:
    inputs:
      test_trade:
        description: "עסקת ניסיון: קנה ומכור $10 ביטקוין לבדיקת הצינור"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: paper-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - run: npm ci

      - name: Load previous portfolio state (for the equity curve)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/bot-state.json?ref=gh-pages" \
            --jq '.content' 2>/dev/null | base64 -d > prev-state.json || echo '{}' > prev-state.json

      - name: Trade on the Alpaca PAPER account (fake money only)
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          TEST_TRADE: ${{ inputs.test_trade }}
        run: npx tsx scripts/paper-trader.mts

      - name: Publish live portfolio state to the site (gh-pages)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f bot-state.json ] || exit 0
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/bot-state.json?ref=gh-pages" --jq '.sha' 2>/dev/null || echo "")
          content=$(base64 -w0 bot-state.json)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/bot-state.json" \
            -f message="chore: update live bot state [skip ci]" \
            -f content="$content" \
            -f branch="gh-pages" \
            ${sha:+-f sha="$sha"}

      - name: Update the heartbeat status issue (no notifications)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f status.json ] || exit 0
          title="📊 מצב הבוט (מסחר מדומה)"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "📊 in:title" --json number --jq '.[0].number')
          if [ -z "$num" ]; then
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "מתעדכן אוטומטית בכל ריצה (~30 דק'). התראות נשלחות רק על עסקאות שבוצעו.")
            num=$(basename "$url")
          fi
          ts=$(jq -r '.updatedAt' status.json)
          body=$(printf "**עדכון אחרון:** %s (UTC)\n\n%s\n\n---\n_מתעדכן כל ~30 דק'. חשבון Paper של Alpaca = כסף מדומה בלבד._" "$ts" "$(jq -r '.lines[]' status.json)")
          gh issue edit "$num" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"

      - name: Post executed orders to the journal issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(jq length actions.json)
          if [ "$count" -eq 0 ]; then echo "no orders"; exit 0; fi
          title="📒 יומן מסחר מדומה"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "📒 in:title" --json number --jq '.[0].number')
          if [ -z "$num" ]; then
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "@eyal99bb-gif כאן הבוט מתעד כל פעולה אוטומטית בחשבון המדומה (Alpaca Paper). כל תגובה חדשה = פעולה שבוצעה.")
            num=$(basename "$url")
          fi
          body=$(jq -r '.[].line' actions.json)
          gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
